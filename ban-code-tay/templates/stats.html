<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thống kê</title>
</head>
<body>
    <h1>Thống kê</h1>
    <a href="/">Về trang chủ</a>

    <p>Tổng số lời nhắn: <b>{{ total }}</b></p>

    <h2>Top 5 người gửi nhiều nhất</h2>
    <ol>
        {% for name, count in top5 %}
        <li>{{ name }}: {{ count }} lời nhắn</li>
        {% endfor %}
    </ol>

    <h2>Biểu đồ</h2>
    {% if total > 0 %}
    <img src="/static/stats.png" alt="Biểu đồ">
    {% else %}
    <p>Chưa có dữ liệu.</p>
    {% endif %}
</body>
</html>
